# herdr configuration
# Only overrides live here — everything else falls through to built-in defaults,
# so new defaults keep applying across upgrades. `herdr --default-config` prints
# the full annotated set.
#
# Key names: spelled-out punctuation like "bracketleft" is rejected; write the
# character itself ("prefix+[").
#
# `herdr config check` does catch a name it cannot parse: "prefix+notakey" comes
# back as `invalid keybinding: keys.next_agent = "prefix+notakey"; disabling
# binding`. ("semicolon" is not an example of that — it is a real key name.)
#
# What it cannot catch is a perfectly valid binding on a chord this terminal never
# delivers, which is how the alt bindings below were lost: they parsed, they were
# accepted, and the keypress arrived as the shorter chord they shadow, so it looked
# like it worked while doing something else. It validates the file, not the
# keyboard — press the key and watch the right thing happen.
#
# Note: copy mode lives at prefix+[ but is NOT listed in [keys], so it is easy
# to shadow it by accident. Leave that key alone.

[keys]
# GNU-Screen style, matching the tmux prefix2 this machine used before.
prefix = "ctrl+a"

# Prefix-less pane movement, replacing what vim-tmux-navigator used to provide.
# This deliberately takes ctrl+h/j/k/l away from the shell — the same trade the
# tmux setup already made, so readline's kill-line (ctrl+k) and clear (ctrl+l)
# were already gone before herdr. vim's own split navigation is given up here;
# splits live at the pane layer instead.
# Fallback if a terminal swallows one of these: prefix+g, then h/j/k/l.
focus_pane_down = "ctrl+j"
focus_pane_up = "ctrl+k"

# Horizontal movement is cycle, not direction, because focus_pane_* stops dead at
# the edge and tmux's select-pane -L/-R wraps. Every tab here is a plain two-pane
# split, where cycling and direction are the same thing — and the wrap is the half
# that the fingers actually remember. Directional right/left is still reachable
# through navigate mode: prefix+g, then h/l.
cycle_pane_previous = "ctrl+h"
cycle_pane_next = "ctrl+l"

# Split down moves off prefix+minus onto prefix+V, beside the default prefix+v
# for a right split — the same shift-pairing tmux uses here.
split_horizontal = "prefix+shift+v"

# tmux's prefix+prefix toggle. Unbound by default; prefix+tab came free when
# cycle_pane_next moved to ctrl+l, and herdr's own defaults suggest this key.
last_pane = "prefix+tab"

# Unbound by default, so there was no way to reach the next workspace without
# opening the picker every time.
previous_workspace = "prefix+left"
next_workspace = "prefix+right"

# Swapped with each other: prefix+s is where tmux's session list lived, and that
# is what the navigator does here. Settings takes over the freed prefix+g.
goto = "prefix+s"
settings = "prefix+g"

# Walking the agent sidebar, which ships with no key at all.
#
# NOT on alt: this machine's terminal does not deliver it, so prefix+alt+n fell
# through to prefix+n and quietly moved tabs instead — indistinguishable from
# working, since both do move something. Upstream's prefix+alt+g and
# prefix+alt+1..9 examples are dead here for the same reason.
#
# On its own letter rather than a direction: h/j/k/l belong to panes and n/p to
# tabs, and both sets were already spoken for. "a" carries no other meaning here,
# and plain-letter plus shifted-letter are both forms this terminal is known to
# deliver. Forward is the constant motion, so it gets the cheaper key.
#
next_agent = "prefix+a"
previous_agent = "prefix+shift+a"

# Jump straight into the attention queue by position. Under agent_panel_sort =
# "priority" these indexes do not name fixed agents — which is the point:
# prefix+shift+1 means "whoever needs me most right now", a stable meaning even
# though the agent behind it changes. The higher numbers are worth less for the
# same reason, so 1 is the one to actually learn.
#
# Not on alt, which this terminal drops. prefix+shift+1..9 is the form herdr's own
# defaults suggest for indexed bindings, and switch_workspace leaves it free.
focus_agent = "prefix+shift+1..9"

# Workspace rows default to arrows only, which is the one list tmux's prefix+s
# let you walk with j/k. Pane movement in this mode gives up j/k for it — no
# loss, since panes are reached with ctrl+j/k outside the mode anyway. h/l still
# move panes here.
#
# Two keys each, because every binding accepts a list as well as a string
# (BindingConfig is untagged One|Many). ctrl+j/k are what these fingers press
# outside this mode for pane focus, so the same chord keeps meaning "down a row"
# once the navigator is open, and bare j/k stay for anyone reaching for vim keys.
navigate_workspace_up = ["k", "ctrl+k"]
navigate_workspace_down = ["j", "ctrl+j"]

# Resize stays on the built-in prefix+r mode. tmux's H/J/K/L were tried as
# [[keys.command]] shellouts and dropped: custom commands have no `bind -r`
# repeat, so every press needed the prefix again. The mode holds until esc.

# Moving a pane between tabs. herdr has the operation (`herdr pane move`) but no
# default binding for it, so both directions go through pane-move.sh.
#
# O and I, out and in, rather than tmux's break/join vocabulary: those two words
# name the same move from opposite ends of a rope, and "break" reads like the
# pane is being destroyed. Both open an fzf picker, so a fresh tab is just the
# first row of the out list instead of a third key. h/j/k/l stay directional.
[[keys.command]]
key = "prefix+shift+o"
type = "popup"
command = "$HOME/.dotfiles/terminal/herdr/pane-move.sh out"
width = "70%"
height = "50%"

[[keys.command]]
key = "prefix+shift+i"
type = "popup"
command = "$HOME/.dotfiles/terminal/herdr/pane-move.sh in"
width = "70%"
height = "50%"

[ui.toast]
# Let iTerm post the banner. This looked broken for a long time and was not:
# iTerm's own notifications were switched off in macOS, so herdr wrote a perfectly
# good escape sequence into a terminal that had been told to stay quiet — and
# still answered `shown: true`, which is what made it read as a herdr bug.
# Sending OSC 9 by hand from a plain iTerm tab, with either terminator, showed
# both, which is what settled it. Test that first if this ever goes silent again;
# do it OUTSIDE herdr, since a pane does not forward those bytes (herdr#2453).
#
# Not "system": that path shells out to terminal-notifier, which is stuck on the
# NSUserNotification API macOS removed, so its banner arrives with a dead click
# and its osascript fallback has no click at all. herdr's own inputs there are
# fine — TERM_PROGRAM, the bundle-id map, and the mdfind check were each verified
# — the tool underneath simply stopped working.
#
# Cost of leaving in-app toasts behind: prefix+o (open_notification_target) goes
# with them. It resolves through focus_toast_target(), which reads
# self.toast.target, and ServerMessage::Notify carries only { kind, message, body }
# — no pane, no workspace — so an external notification has no destination to
# return to. Upstream closed exactly that request as intended behaviour
# (herdr#2684). The banner names the agent, so the way back is the attention queue:
# prefix+shift+1 for whoever is most urgent, prefix+a to walk.
delivery = "terminal"

[ui]
show_agent_labels_on_pane_borders = true

# Waiting on a release for status_indicators = "symbols", which gives each agent
# state its own shape (× blocked, ◐ working, ✓ finished, ○ seen) instead of the
# default dots, where blocked, working, and finished-but-unseen are all the same ●
# separated only by colour. The field is on main as of 2026-08-16 but in no
# release yet: v0.8.0 shipped 2026-08-03 and the newest preview is 2026-08-04, so
# the running binary answers `unknown config key ui.status_indicators; ignoring
# key`. Re-add it after the next update; do not trust CHANGELOG's Unreleased
# section to tell you, it was empty while main had two weeks of commits.
#
# Icon colour is not configurable either way — state_label_color hardcodes the
# state-to-token mapping (blocked=red, working=yellow, done=teal, idle=green).
# Only the palette behind those tokens can move, via [theme.custom], which
# repaints the rest of the UI with it.

# Sidebar agents are sorted by who is waiting on a human, not by which space they
# live in. With twenty agent panes, "which one needs me" is the only question the
# panel gets asked; grouping by space just reproduces what the tab bar shows.
agent_panel_sort = "priority"
