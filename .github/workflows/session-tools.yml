name: Session tools
on:
  pull_request:
    paths:
      - 'tools/agent-hooks/pane-tell*'
      - 'tools/agent-hooks/main-alert-*'
      - 'tools/agent-hooks/main-user-relay*'
      - 'tools/agent-hooks/pane-relay-watch*'
      - 'tools/agent-hooks/pane-label-nudge*'
      - 'tools/agent-hooks/yoyoo-share-guard.py'
      - 'tools/agent-hooks/herdr_peers.py'
      - 'tools/agent-hooks/workers-watch.py'
      - 'tools/agent-hooks/pane-spawn*'
      - 'shell/zsh/codex-fn.test.sh'
      - 'shell/zsh/zshrc'
      - 'tools/agent-hooks/codex-startup*'
      - 'tools/agent-hooks/codex-memory*'
      - 'tools/agent-hooks/install-codex-startup*'
      - 'tools/agent-hooks/task-ledger*'
      - 'tools/agent-hooks/codex-deferred*'
      - 'tools/agent-hooks/auto-tab-close.py'
      - 'tools/agent-hooks/test_auto_check_relay.py'
      - 'tools/agent-hooks/test_startup_estimate.py'
      - 'scripts/claude-online*'
      - 'tools/claude/hooks/slack-format-check.py'
      - 'tools/claude/hooks/test_slack_wording.py'
      - '.github/workflows/session-tools.yml'
  push:
    branches: [main]
    paths:
      - 'tools/agent-hooks/pane-tell*'
      - 'tools/agent-hooks/main-alert-*'
      - 'tools/agent-hooks/main-user-relay*'
      - 'tools/agent-hooks/pane-relay-watch*'
      - 'tools/agent-hooks/pane-label-nudge*'
      - 'tools/agent-hooks/yoyoo-share-guard.py'
      - 'tools/agent-hooks/herdr_peers.py'
      - 'tools/agent-hooks/workers-watch.py'
      - 'tools/agent-hooks/pane-spawn*'
      - 'shell/zsh/codex-fn.test.sh'
      - 'shell/zsh/zshrc'
      - 'tools/agent-hooks/codex-startup*'
      - 'tools/agent-hooks/codex-memory*'
      - 'tools/agent-hooks/install-codex-startup*'
      - 'tools/agent-hooks/task-ledger*'
      - 'tools/agent-hooks/codex-deferred*'
      - 'tools/agent-hooks/auto-tab-close.py'
      - 'tools/agent-hooks/test_auto_check_relay.py'
      - 'tools/agent-hooks/test_startup_estimate.py'
      - 'scripts/claude-online*'
      - 'tools/claude/hooks/slack-format-check.py'
      - 'tools/claude/hooks/test_slack_wording.py'
      - '.github/workflows/session-tools.yml'
permissions:
  contents: read
jobs:
  session-tools:
    runs-on: macos-15
    env:
      CLAUDE_BIN: /usr/bin/false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Match the workstation Bash runtime
        run: |
          brew install bash
          echo "$(brew --prefix bash)/bin" >> "$GITHUB_PATH"
      - name: Check every pane-tell suite
        run: |
          set -e
          for test in tools/agent-hooks/pane-tell.test.sh tools/agent-hooks/pane-tell-*.test.sh; do
            bash "$test"
          done
      - run: python3 tools/agent-hooks/workers-watch.py --selftest
      - run: python3 tools/agent-hooks/pane-tell-order.test.py --selftest
      - run: bash tools/agent-hooks/pane-relay-watch.test.sh
      - run: bash tools/agent-hooks/main-alert-inbox.test.sh
      - run: bash tools/agent-hooks/main-alert-wake.test.sh
      - run: bash tools/agent-hooks/main-alert-hooks.test.sh
      - run: bash tools/agent-hooks/main-user-relay.test.sh
      - name: Check every pane-spawn suite
        run: |
          set -e
          for test in tools/agent-hooks/pane-spawn*.test.sh; do
            bash "$test"
          done
      - run: python3 -m unittest discover -s tools/agent-hooks -p test_startup_estimate.py
      - run: bash shell/zsh/codex-fn.test.sh
      - run: python3 tools/agent-hooks/codex-startup.test.py
      - run: python3 tools/agent-hooks/codex-memory.test.py
      - run: python3 tools/agent-hooks/install-codex-startup.test.py
      - run: python3 tools/agent-hooks/task-ledger.test.py
      - run: bash tools/agent-hooks/codex-deferred.test.sh
      - run: python3 -m unittest discover -s tools/agent-hooks -p test_auto_check_relay.py
      - run: bash scripts/claude-online.test.sh
      - run: python3 -m unittest discover -s tools/claude/hooks -p test_slack_wording.py
      - run: python3 tools/claude/hooks/slack-format-check.py --selftest
